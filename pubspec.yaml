name: GeniusHouse
description: A professional alternative energy store app for Syria
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  share_plus: ^12.0.2
  fl_chart: ^0.68.0
  lottie: ^2.7.0
  url_launcher: ^6.2.5
  pusher_channels_flutter: ^2.2.1
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.9
  animations: ^2.0.7
  flutter_staggered_animations: ^1.1.0
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.2
  flutter_local_notifications: ^18.0.0
  http: ^1.2.0
  dio: ^5.4.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  photo_view: ^0.14.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  flutter_markdown: ^0.6.20
  intl: ^0.18.1
  connectivity_plus: ^5.0.2
  shimmer: ^3.0.0
  rename: ^3.1.0
  flutter_sound: ^9.2.13
  audioplayers: ^5.2.1
  path_provider: ^2.1.2
  speech_to_text: ^7.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_nex.png"
